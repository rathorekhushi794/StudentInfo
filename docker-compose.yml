services:
  db:
    image: mysql:8.0
    container_name: student_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: studentdb
    ports:
      - "3307:3306"   # MySQL exposed on localhost:3307
    volumes:
      - db_data:/var/lib/mysql   # persist database data

  app:
    build: .
    container_name: student_app
    depends_on:
      - db
    stdin_open: true   # allow interactive menu input
    tty: true
    environment:
      DB_URL: jdbc:mysql://db:3306/studentdb
      DB_USER: root
      DB_PASSWORD: password

volumes:
  db_data:   # named volume to persist MySQL data

